name: Node CI

on: [push]

permissions:
  id-token: write  # Required for OIDC
  contents: write

jobs:
  build:
    runs-on: 'ubuntu-latest'

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 12
          runtime: node@${{ matrix.node }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: pnpm install, build, and test
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build:prod
          pnpm test
        env:
          CI: true
      - name: lint
        run: |
          pnpm lint:js
          pnpm lint:css
        env:
          CI: true

  publish:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 12
          runtime: node@${{ matrix.node }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:prod
      - run: pnpm test
      - uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        id: publishNpm
        with:
          dry-run: false
      - if: ${{ steps.publishNpm.outputs.type }}
        run: gh release create ${{ steps.publishNpm.outputs.version }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
