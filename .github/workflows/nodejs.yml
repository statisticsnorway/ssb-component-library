name: Node CI

on: [push]

permissions:
  id-token: write  # Required for OIDC
  contents: write

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: pnpm install, build, and test
        run: |
          pnpm ci
          pnpm run build:prod
          pnpm test
        env:
          CI: true
      - name: lint
        run: |
          pnpm run lint:js
          pnpm run lint:css
        env:
          CI: true

  publish:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          node-version: 22
      - name: Update pnpm
        run: pnpm install -g pnpm@latest
      - run: pnpm ci
      - run: pnpm run build:prod
      - run: pnpm test
      - uses: JS-DevTools/pnpm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        id: publishNpm
        with:
          dry-run: false
      - if: ${{ steps.publishNpm.outputs.type }}
        run: gh release create ${{ steps.publishNpm.outputs.version }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
